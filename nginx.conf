server {
    listen 8082;
    server_name localhost;

    port_in_redirect off;

    # 1. AQUÍ SERVIMOS TU PÁGINA WEB
    location /vm2/front/ {
        # Usamos root en lugar de alias (Nginx buscará automáticamente en /usr/share/nginx/html/vm2/front/)
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /vm2/front/index.html;
    }

    # 2. EL PROXY AL BACKEND (Este se queda igual, estaba perfecto)
    location /vm2/ {
        proxy_pass http://172.17.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2b. PROXY AL CORCHO (Spring de compañeros, puerto 8181)
    location /api/corcho/ {
        proxy_pass http://172.17.0.1:8181/api/corcho/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Archivos de foto de perfil montados por volumen Docker
    location /vm2/fotos-perfil/ {
        alias /data/uploads/perfiles/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 4. Archivos de foto de credencial montados por volumen Docker
    location /vm2/fotos-credencial/ {
        alias /data/uploads/credenciales/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
